name: Deploy site

on:
  workflow_dispatch:

jobs:
  prepare-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Copy static files to dist
        run: |
          mkdir -p dist
          cp -r src/* dist/

      - name: Clean target directory
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: octobot
          key: ${{ secrets.OCTOBOT_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            rm -rf /var/www/mateber.es/html/*

      - name: Deploy files using SCP
        uses: appleboy/scp-action@v0.1.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: octobot
          key: ${{ secrets.OCTOBOT_SSH_PRIVATE_KEY }}
          port: 22
          source: "dist/."
          target: "/var/www/mateber.es/html/"

      - name: Flatten deployed directory
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: octobot
          key: ${{ secrets.OCTOBOT_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            if [ -d /var/www/mateber.es/html/dist ]; then
              mv /var/www/mateber.es/html/dist/* /var/www/mateber.es/html/ && rm -rf /var/www/mateber.es/html/dist
            fi