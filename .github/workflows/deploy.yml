name: Deploy site

on:
  workflow_dispatch:

jobs:
  prepare-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Copy static files to dist
        run: |
          mkdir -p dist
          cp -r src/* dist/

      - name: Clean target directory
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: octobot
          key: ${{ secrets.OCTOBOT_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            rm -rf /var/www/mateber.es/html/*

      - name: Deploy files using rsync
        uses: appleboy/rsync-action@v0.1.6
        with:
          args: --delete -avz dist/ /var/www/mateber.es/html/
          host: ${{ secrets.DROPLET_HOST }}
          username: octobot
          key: ${{ secrets.OCTOBOT_SSH_PRIVATE_KEY }}
          port: 22
